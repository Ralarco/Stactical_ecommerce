version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stactical-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: stactical
      POSTGRES_PASSWORD: stactical_dev
      POSTGRES_DB: stactical_ecommerce
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stactical']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
